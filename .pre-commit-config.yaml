# Install the local hook with `pre-commit install`; run all checks with
# `pre-commit run --all-files`.
repos:
  - repo: local
    hooks:
      - id: juliaformatter
        name: JuliaFormatter 2.14.0 (default style)
        entry: julia
        language: system
        args:
          - --startup-file=no
          - --history-file=no
          - --project=@gpuffm_formatter
          - tooling/format_julia.jl
        files: '\.jl$'
        types: [julia]
        require_serial: true

  - repo: https://github.com/RelationalAI-oss/ReLint.jl
    rev: v0.1.16
    hooks:
      - id: lint-checks
        stages: [manual]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        types: [text]
        exclude: '^(?:src/CuModMatrix/CuModMatrix\.jl|src/CuModMatrix/kernel_mul/mat_mul_gpu_direct\.jl|src/CuModMatrix/kernel_mul/mat_mul_hybrid\.jl|src/CuModMatrix/kernel_mul/stripe_mul\.jl|src/CuModMatrix/triangular/hensel\.jl|test/CuModMatrix/test_swap\.jl|test/Experiments/max_kernels\.jl)$'
      - id: end-of-file-fixer
        types: [text]
      - id: check-toml
      - id: check-yaml
