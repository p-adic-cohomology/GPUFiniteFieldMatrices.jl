# Install the local hook with `pre-commit install`; run all checks with
# `pre-commit run --all-files`.
repos:
  - repo: local
    hooks:
      - id: juliaformatter
        name: JuliaFormatter 2.14.0 (default style)
        entry: julia
        language: system
        args:
          - --startup-file=no
          - --history-file=no
          - --project=@gpuffm_formatter
          - -e
          - 'import Pkg; required = v"2.14.0"; versions = [dep.version for dep in values(Pkg.dependencies()) if dep.name == "JuliaFormatter"]; (length(versions) == 1 && only(versions) == required) || Pkg.add(Pkg.PackageSpec(name="JuliaFormatter", version=required)); using JuliaFormatter; Base.pkgversion(JuliaFormatter) == required || error("Expected JuliaFormatter $(required), found $(Base.pkgversion(JuliaFormatter))"); exit(JuliaFormatter.format(ARGS; throw_on_error=true) ? 0 : 1)'
        types: [julia]
        require_serial: true

  - repo: https://github.com/RelationalAI-oss/ReLint.jl
    rev: v0.1.16
    hooks:
      - id: lint-checks
        stages: [manual]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        types: [text]
        exclude: '^(?:src/CuModMatrix/CuModMatrix\.jl|src/CuModMatrix/kernel_mul/mat_mul_gpu_direct\.jl|src/CuModMatrix/kernel_mul/stripe_mul\.jl|test/Experiments/legacy_swap_benchmark\.jl|test/Experiments/max_kernels\.jl)$'
      - id: end-of-file-fixer
        types: [text]
      - id: check-toml
      - id: check-yaml
