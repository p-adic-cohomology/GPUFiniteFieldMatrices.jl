name: CI

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        version:
          - "1.12"
        os:
          - ubuntu-latest
          - macos-latest
        arch:
          - x64

    permissions:
      actions: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}

      - uses: julia-actions/cache@v2

      - name: Verify minimal core environment
        run: sh test/run-core-environment-smoke.sh

      - name: Run package tests in a fresh project view
        run: sh test/run-pkg-test.sh
